<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TigerOffers · Sala de controle de reembolso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#FBFCFD; --surface:#FFFFFF; --rail:#14243F; --rail-2:#1F3864;
  --line:#E4E9F0; --line-soft:#EFF3F8;
  --ink:#0F1E38; --ink-2:#3D4C63; --muted:#7C8AA0;
  --navy:#1F3864; --blue:#2F5597; --gold:#C9A227;
  --red:#C0392B; --amber:#E8A33D; --green:#2E7D32; --teal:#1F7A8C;
  --c0:#F2F6FC; --c1:#DCE7F5; --c2:#F7DCC9; --c3:#EFB295; --c4:#DC7C60; --c5:#B8442F;
  --r:10px; --pad:20px;
  --fd:'Archivo',system-ui,sans-serif;
  --fb:'IBM Plex Sans',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--canvas);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:216px 1fr;min-height:100vh}
.rail{background:var(--rail);color:#fff;padding:22px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 20px 22px;border-bottom:1px solid rgba(255,255,255,.09);margin-bottom:16px}
.brand b{font-family:var(--fd);font-size:16px;font-weight:700;letter-spacing:-.2px;display:block}
.brand span{font-size:10.5px;color:#8FA4C8;letter-spacing:.9px;text-transform:uppercase;display:block;margin-top:4px}
.navgrp{padding:0 12px;margin-bottom:6px}
.navgrp em{font-style:normal;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:#6E82A8;padding:12px 8px 6px;display:block}
.nav{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:0;background:none;color:#C6D3E8;
  font-family:var(--fb);font-size:13.5px;text-align:left;border-radius:7px;cursor:pointer;transition:background .13s,color .13s}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav[aria-selected="true"]{background:var(--rail-2);color:#fff;font-weight:600}
.nav .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.5;flex:none}
.nav[aria-selected="true"] .dot{background:var(--gold);opacity:1}
.railfoot{padding:16px 20px;margin-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px;color:#7089B0;line-height:1.6}

.main{padding:26px 30px 60px;max-width:1560px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap}
h1{font-family:var(--fd);font-size:25px;font-weight:700;letter-spacing:-.5px;margin:0 0 5px}
.sub{color:var(--muted);font-size:13px;margin:0;max-width:760px}
.periodo{font-family:var(--fm);font-size:11px;color:var(--muted);border:1px solid var(--line);
  background:var(--surface);padding:7px 12px;border-radius:99px;white-space:nowrap}

/* ---------- cards ---------- */
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:1.6fr 1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad)}
.card h3{font-family:var(--fd);font-size:14.5px;font-weight:600;margin:0 0 3px;letter-spacing:-.1px}
.card .cap{font-size:11.5px;color:var(--muted);margin:0 0 14px;line-height:1.45}
.kpi{position:relative;padding-left:22px}
.kpi::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:3px;background:var(--line)}
.kpi.is-red::before{background:var(--red)} .kpi.is-amber::before{background:var(--amber)}
.kpi.is-green::before{background:var(--green)} .kpi.is-navy::before{background:var(--navy)}
.kpi .lab{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--fm);font-size:29px;font-weight:600;letter-spacing:-1px;margin:5px 0 2px;line-height:1.1}
.kpi .note{font-size:11.5px;color:var(--muted)}
.kpi .spark{margin-top:10px}

/* ---------- tags ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.4px;
  padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
.t-red{background:#FCEBE9;color:#9E2E22} .t-amber{background:#FDF3E3;color:#8A5A00}
.t-green{background:#E9F3EA;color:#1F5C23} .t-blue{background:#EAF0FA;color:#254B87}
.t-grey{background:#F0F3F7;color:#5C6B82}

/* ---------- tabelas ---------- */
.tw{overflow:auto;max-height:560px;border-radius:8px;border:1px solid var(--line-soft)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--blue);color:#fff;font-weight:600;font-size:10.5px;letter-spacing:.5px;
  text-transform:uppercase;padding:9px 10px;text-align:left;white-space:nowrap;z-index:2;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
th:hover{background:#26467E}
th .ar{opacity:.45;font-size:9px;margin-left:3px}
td{padding:8px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
tbody tr:nth-child(even){background:#FAFBFD}
tbody tr:hover{background:#F2F6FC}
td.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.bar-cell{position:relative}
.bar-cell i{position:absolute;left:0;top:50%;transform:translateY(-50%);height:16px;background:#E7EEF9;border-radius:3px;z-index:0}
.bar-cell span{position:relative;z-index:1}

/* ---------- cohort ---------- */
.cohort{overflow:auto;border:1px solid var(--line-soft);border-radius:8px}
.cohort table{font-size:11.5px;border-collapse:separate;border-spacing:0}
.cohort th{background:#F7F9FC;color:var(--ink-2);border-bottom:1px solid var(--line);cursor:default}
.cohort th:hover{background:#F7F9FC}
.cohort td{border:0;padding:0}
.cohort .cel{height:26px;min-width:44px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fm);font-size:11px;color:var(--ink);border-right:1px solid #fff;border-bottom:1px solid #fff}
.cohort .lbl{font-family:var(--fm);font-size:11px;color:var(--ink-2);padding:0 10px;white-space:nowrap;
  background:#FCFDFE;border-right:1px solid var(--line);height:26px;display:flex;align-items:center}
.cohort .fut{background:repeating-linear-gradient(135deg,#F7F9FC,#F7F9FC 4px,#EDF1F7 4px,#EDF1F7 8px);color:transparent}
.legend{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.legend .sw{width:26px;height:12px;border-radius:2px;display:inline-block}

/* ---------- misc ---------- */
.split{display:flex;gap:2px;height:26px;border-radius:5px;overflow:hidden;margin:8px 0 4px}
.split div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:600;font-family:var(--fm)}
.note{background:#FFF9EC;border-left:3px solid var(--gold);padding:13px 15px;border-radius:0 8px 8px 0;font-size:12.5px;color:#5C4A17;line-height:1.55}
.note b{color:#3F3210}
.alerta{background:#FDF0EE;border-left:3px solid var(--red);padding:13px 15px;border-radius:0 8px 8px 0;font-size:12.5px;color:#7A2A1F;line-height:1.55}
.ok{background:#EDF5EE;border-left:3px solid var(--green);padding:13px 15px;border-radius:0 8px 8px 0;font-size:12.5px;color:#1D4A21;line-height:1.55}
.view{display:none} .view.on{display:block}
.sec{font-family:var(--fd);font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);
  margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.ctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-family:var(--fb);font-size:12px;
  padding:6px 12px;border-radius:7px;cursor:pointer;transition:.13s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
input[type=search]{border:1px solid var(--line);border-radius:7px;padding:7px 11px;font-family:var(--fb);font-size:12.5px;
  width:230px;background:var(--surface);color:var(--ink)}
input[type=search]:focus{outline:2px solid #BFD3F0;outline-offset:1px;border-color:var(--blue)}
.dl{display:grid;grid-template-columns:190px 1fr;gap:9px 18px;font-size:12.5px}
.dl dt{color:var(--blue);font-weight:600;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding-top:2px}
.dl dd{margin:0;color:var(--ink-2);line-height:1.55}
svg text{font-family:var(--fm);font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:var(--rail);color:#fff;font-size:11.5px;padding:7px 10px;
  border-radius:6px;opacity:0;transition:opacity .1s;z-index:99;font-family:var(--fm);white-space:pre;line-height:1.55}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:1180px){.shell{grid-template-columns:1fr}.rail{position:static;height:auto;display:flex;
  flex-wrap:wrap;gap:4px;padding:14px}.brand{width:100%;border:0;margin:0 0 8px;padding:0 8px 10px}
  .navgrp{padding:0}.navgrp em{display:none}.g4,.g3,.g2,.g23,.g32{grid-template-columns:1fr}.main{padding:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.rail{display:none}.shell{grid-template-columns:1fr}.view{display:block!important;page-break-after:always}}
</style>
</head>

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

/* ---------------- SVG charts ---------------- */
function svgEl(w,h){return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block;overflow:visible" role="img">`}

function lineChart(series,opts={}){
  const w=opts.w||620,h=opts.h||260,m={t:14,r:16,b:34,l:opts.l||44};
  const iw=w-m.l-m.r, ih=h-m.t-m.b;
  const labels=opts.labels||[];
  const all=series.flatMap(s=>s.values.filter(v=>v!=null));
  let lo=opts.min!=null?opts.min:Math.min(...all), hi=opts.max!=null?opts.max:Math.max(...all);
  if(lo===hi){hi=lo+1}
  const pad=(hi-lo)*.12; if(opts.min==null)lo-=pad; if(opts.max==null)hi+=pad;
  const X=i=>m.l+(labels.length<2?iw/2:i*iw/(labels.length-1));
  const Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  let s=svgEl(w,h);
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    s+=`<line x1="${m.l}" y1="${y}" x2="${w-m.r}" y2="${y}" stroke="var(--line-soft)"/>`;
    s+=`<text x="${m.l-8}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${opts.fmtY?opts.fmtY(v):Math.round(v)}</text>`}
  labels.forEach((l,i)=>{if(labels.length<=14||i%2===0)
    s+=`<text x="${X(i)}" y="${h-12}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${l}</text>`});
  series.forEach(se=>{
    const pts=se.values.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    if(!pts.length)return;
    const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    if(se.area)s+=`<path d="${d} L${pts.at(-1)[0]} ${m.t+ih} L${pts[0][0]} ${m.t+ih} Z" fill="${se.color}" opacity=".07"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.dash?1.8:2.4}" stroke-linecap="round"
        stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 5"':''}/>`;
    if(!se.dash)pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="#fff" stroke="${se.color}" stroke-width="2"
      class="pt" data-t="${(se.name||'')+' · '+(labels[i]||'')+'\n'+(opts.fmtT?opts.fmtT(se.values[i]):se.values[i])}"/>`});
  });
  s+='</svg>';
  const leg=series.filter(x=>x.name).map(x=>
    `<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:11.5px;color:var(--ink-2)">
     <i style="width:14px;height:2.6px;background:${x.color};border-radius:2px;display:inline-block"></i>${x.name}</span>`).join('');
  return s+(leg?`<div style="margin-top:10px">${leg}</div>`:'');
}

function barsH(rows,opts={}){
  const max=Math.max(...rows.map(r=>r.v));
  return rows.map(r=>{
    const p=r.v/max*100;
    return `<div style="margin-bottom:9px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
        <span style="color:var(--ink)">${r.k}</span>
        <span class="num" style="color:var(--ink-2)">${opts.fmt?opts.fmt(r.v):r.v}</span></div>
      <div style="height:8px;background:var(--line-soft);border-radius:4px;overflow:hidden">
        <div style="width:${p}%;height:100%;background:${r.color||'var(--blue)'};border-radius:4px"></div></div></div>`;
  }).join('');
}

function stackedPct(rows,opts={}){
  const w=opts.w||620,h=opts.h||280,m={t:12,r:10,b:34,l:34};
  const iw=w-m.l-m.r, ih=h-m.t-m.b, bw=iw/rows.length*.62, gap=iw/rows.length;
  let s=svgEl(w,h);
  [0,25,50,75,100].forEach(v=>{const y=m.t+ih-v/100*ih;
    s+=`<line x1="${m.l}" y1="${y}" x2="${w-m.r}" y2="${y}" stroke="var(--line-soft)"/>
        <text x="${m.l-7}" y="${y+3.5}" text-anchor="end" font-size="9.5" fill="var(--muted)">${v}%</text>`});
  rows.forEach((r,i)=>{
    const x=m.l+i*gap+(gap-bw)/2; let acc=0;
    r.parts.forEach(p=>{
      const hh=p.v*ih; const y=m.t+ih-acc-hh; acc+=hh;
      s+=`<rect x="${x}" y="${y}" width="${bw}" height="${Math.max(hh,0)}" fill="${p.color}" rx="1.5"
           class="pt" data-t="${r.k} · ${p.name}\n${pct(p.v)}"/>`;
      if(hh>19)s+=`<text x="${x+bw/2}" y="${y+hh/2+3.5}" text-anchor="middle" font-size="10.5"
           fill="${p.dark?'var(--navy)':'#fff'}" font-weight="600">${Math.round(p.v*100)}%</text>`});
    s+=`<text x="${x+bw/2}" y="${h-12}" text-anchor="middle" font-size="10.5" fill="var(--ink-2)">${r.k}</text>`});
  s+='</svg>';
  const leg=rows[0].parts.map(p=>`<span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:11.5px;color:var(--ink-2)">
    <i style="width:11px;height:11px;background:${p.color};border-radius:3px;display:inline-block"></i>${p.name}</span>`).join('');
  return s+`<div style="margin-top:10px">${leg}</div>`;
}

function scatter(pts,opts={}){
  const w=opts.w||620,h=opts.h||330,m={t:16,r:20,b:40,l:52};
  const iw=w-m.l-m.r, ih=h-m.t-m.b;
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const xm=Math.max(...xs)*1.06, ym=Math.max(...ys)*1.12;
  const X=v=>m.l+v/xm*iw, Y=v=>m.t+ih-v/ym*ih;
  const rmax=Math.max(...pts.map(p=>Math.abs(p.r||1)));
  let s=svgEl(w,h);
  for(let i=0;i<=4;i++){const v=ym*i/4,y=Y(v);
    s+=`<line x1="${m.l}" y1="${y}" x2="${w-m.r}" y2="${y}" stroke="var(--line-soft)"/>
        <text x="${m.l-8}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${pct(v,0)}</text>`}
  for(let i=0;i<=4;i++){const v=xm*i/4;
    s+=`<text x="${X(v)}" y="${h-14}" text-anchor="middle" font-size="10" fill="var(--muted)">${moneyK(v)}</text>`}
  if(opts.ref!=null){const y=Y(opts.ref);
    s+=`<line x1="${m.l}" y1="${y}" x2="${w-m.r}" y2="${y}" stroke="var(--navy)" stroke-width="1.4" stroke-dasharray="5 4"/>
        <text x="${w-m.r}" y="${y-7}" text-anchor="end" font-size="10" fill="var(--navy)">média ${pct(opts.ref)}</text>`}
  pts.forEach(p=>{
    const rr=6+Math.sqrt(Math.abs(p.r||1)/rmax)*15;
    s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${rr}" fill="${p.color}" opacity=".6" stroke="${p.color}" stroke-width="1.4"
         class="pt" data-t="${p.k}\ngross ${moneyK(p.x)} · saída ${pct(p.y)}${p.r!=null?'\nnet '+moneyK(p.r):''}"/>`;
    if(p.label)s+=`<text x="${X(p.x)}" y="${Y(p.y)-rr-5}" text-anchor="middle" font-size="10" fill="var(--ink-2)">${p.k}</text>`});
  s+=`<text x="${m.l+iw/2}" y="${h-1}" text-anchor="middle" font-size="10" fill="var(--muted)">gross do ano</text>`;
  return s+'</svg>';
}

function spark(vals,color){
  const w=150,h=30,lo=Math.min(...vals),hi=Math.max(...vals);
  const X=i=>i*w/(vals.length-1), Y=v=>h-2-(v-lo)/((hi-lo)||1)*(h-6);
  const d=vals.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block">
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="${color}" opacity=".08"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.9" stroke-linejoin="round"/>
    <circle cx="${X(vals.length-1)}" cy="${Y(vals.at(-1))}" r="2.6" fill="${color}"/></svg>`;
}

/* ---------------- sortable table ---------------- */
function table(cols,rows,opts={}){
  const id='t'+Math.random().toString(36).slice(2,7);
  const head=cols.map((c,i)=>`<th class="${c.r?'r':''}" data-i="${i}">${c.h}<span class="ar">↕</span></th>`).join('');
  const body=rows.map(r=>'<tr>'+cols.map(c=>{
    const v=c.get(r);
    const cls=(c.r?'r ':'')+(c.num?'num ':'');
    if(c.bar!=null){const p=Math.max(0,Math.min(1,c.bar(r)))*100;
      return `<td class="${cls}bar-cell"><i style="width:${p}%"></i><span>${v}</span></td>`}
    return `<td class="${cls}">${v}</td>`}).join('')+'</tr>').join('');
  setTimeout(()=>{
    const t=$('#'+id); if(!t)return;
    $$('th',t).forEach(th=>th.onclick=()=>{
      const i=+th.dataset.i, c=cols[i], tb=$('tbody',t);
      const dir=th.dataset.d==='a'?-1:1; $$('th',t).forEach(x=>delete x.dataset.d); th.dataset.d=dir>0?'a':'d';
      const sorted=[...rows].sort((x,y)=>{
        const a=c.sort?c.sort(x):c.get(x), b=c.sort?c.sort(y):c.get(y);
        if(typeof a==='number'&&typeof b==='number')return (a-b)*dir;
        return String(a).localeCompare(String(b),'pt-BR')*dir});
      tb.innerHTML=sorted.map(r=>'<tr>'+cols.map(c=>{
        const v=c.get(r), cls=(c.r?'r ':'')+(c.num?'num ':'');
        if(c.bar!=null){const p=Math.max(0,Math.min(1,c.bar(r)))*100;
          return `<td class="${cls}bar-cell"><i style="width:${p}%"></i><span>${v}</span></td>`}
        return `<td class="${cls}">${v}</td>`}).join('')+'</tr>').join('');
    });
  },0);
  return `<div class="tw"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

      kpi.innerHTML=`<div class="grid g3" style="margin-bottom:10px">${[['Na 1ª semana','w0'],['Em 4 semanas','w4'],['Em 8 semanas','w8']].map(([l,k])=>
        `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#FCFDFE">
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">${l}</div>
          <div class="num" style="font-size:20px;font-weight:600;margin:2px 0 1px">${pct(g[k])}</div>
          ${cmp(g[k],ref_[k])}</div>`).join('')}</div>`;
    } else { kpi.innerHTML=''; }
  }
  setTimeout(bindTips,0);
};

  return `<div class="grid g2">
    <div class="card"><h3>Dois blocos, respostas diferentes</h3>
      <p class="cap">Valor reembolsado no ano por natureza do motivo declarado.</p>
      <div class="split">
        <div style="flex:${cb};background:var(--amber)">${pct(cb/(cb+outros),0)} ligado a chargeback</div>
        <div style="flex:${outros};background:var(--teal)">${pct(outros/(cb+outros),0)} contestável</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">
        <div><div class="num" style="font-size:22px;color:var(--amber);font-weight:600">${moneyK(cb)}</div>
          <div style="font-size:12px;color:var(--ink-2);margin-top:4px">Alerta ou ameaça de chargeback. É a categoria que a BuyGoods foi autorizada a tratar no automático.</div></div>
        <div><div class="num" style="font-size:22px;color:var(--teal);font-weight:600">${moneyK(outros)}</div>
          <div style="font-size:12px;color:var(--ink-2);margin-top:4px">Arrependimento, upsell, "não lembro da compra". É o ticket que o CS reverte — e que hoje não chega até nós.</div></div>
      </div>
      <div class="note" style="margin-top:16px">Este é o único bloco grande o bastante para mudar o resultado do ano.</div></div>
    <div class="card"><h3>Motivos por valor</h3><p class="cap">Top 12 do ano. Laranja = ligado a chargeback.</p>
      ${barsH(D.motivos.slice(0,12).map(m=>({k:m.reason.length>44?m.reason.slice(0,42)+'…':m.reason,v:N(m.Total),
        color:/chargeback|rdr|threat/i.test(m.reason)?'var(--amber)':'var(--teal)'})),{fmt:moneyK})}</div>
  </div>
  <div class="sec">Tabela completa</div>
  ${table([
    {h:'Motivo',get:r=>r.reason},
    {h:'Valor no ano',r:1,num:1,get:r=>money(N(r.Total)),sort:r=>N(r.Total),bar:r=>N(r.Total)/N(D.motivos[0].Total)},

    {h:'Natureza',get:r=>/chargeback|rdr|threat/i.test(r.reason)?'<span class="tag t-amber">chargeback</span>':'<span class="tag t-blue">contestável</span>'}

};

V.produtos=()=>{

    k:r.produto,x:N(r.Gross),y:N(r['% Saida total ($)']),r:N(r['Net oficial']),
    color:N(r['Net oficial'])<0?'var(--red)':N(r['% Saida total ($)'])>=.22?'var(--amber)':'var(--blue)',
    label:N(r.Gross)>800000||N(r['Net oficial'])<0}));
  return `<div class="grid g32">
    <div class="card"><h3>Gross × taxa de saída</h3>
      <p class="cap">Cada bolha é um produto com mais de $50 mil de gross. O tamanho é o Net oficial. Vermelho = Net negativo.</p>
      ${scatter(pts,{w:700,h:360,ref:(RF+CB)/G})}</div>
    <div class="card"><h3>Classificação</h3><p class="cap">Regra: Net oficial negativo, ou saída acima de 30%, ou base incompleta.</p>
      ${['NEGATIVO','ATENCAO','POSITIVO','NEUTRO','NAO CLASSIFICADO'].map(c=>{
        const q=p.filter(r=>String(r.Classificacao||'').startsWith(c));
        if(!q.length)return'';
        const cls=c==='NEGATIVO'?'t-red':c==='ATENCAO'?'t-amber':c==='POSITIVO'?'t-green':'t-grey';
        return `<div style="margin-bottom:13px"><span class="tag ${cls}">${c==='NAO CLASSIFICADO'?'sem classificação':c.toLowerCase()}</span>
          <span class="num" style="font-size:12px;color:var(--muted);margin-left:8px">${q.length} produtos · ${moneyK(q.reduce((a,r)=>a+N(r.Gross),0))}</span>
          <div style="font-size:12px;color:var(--ink-2);margin-top:5px">${q.slice(0,6).map(r=>r.produto).join(', ')}${q.length>6?'…':''}</div></div>`}).join('')}
      <div class="alerta" style="margin-top:6px"><b>LipoVive é a decisão pendente.</b> $1,05 mi de faturamento, Net oficial negativo
      e 29,7% de saída. Quinto maior da operação e o único dessa faixa no vermelho.</div></div>
  </div>
  <div class="sec">Todos os produtos</div>
  ${table([
    {h:'Produto',get:r=>r.produto},
    {h:'Pedidos',r:1,num:1,get:r=>N(r.Pedidos)?.toLocaleString('pt-BR')??'—',sort:r=>N(r.Pedidos)||0},
    {h:'Gross',r:1,num:1,get:r=>money(N(r.Gross)),sort:r=>N(r.Gross)||0,bar:r=>N(r.Gross)/5.5e6},

    {h:'Chargeback',r:1,num:1,get:r=>money(N(r['Valor de chargeback'])),sort:r=>N(r['Valor de chargeback'])||0},
    {h:'% saída',r:1,num:1,get:r=>{const v=N(r['% Saida total ($)']);
      return v==null?'<span style="color:var(--muted)">n/d</span>':`<b style="color:${v>=.28?'var(--red)':v>=.2?'var(--amber)':'var(--ink)'}">${pct(v)}</b>`},
      sort:r=>N(r['% Saida total ($)'])??-1},
    {h:'Net oficial',r:1,num:1,get:r=>{const v=N(r['Net oficial']);
      return v==null?'—':`<span style="color:${v<0?'var(--red)':'var(--ink)'}">${money(v)}</span>`},sort:r=>N(r['Net oficial'])??-1e9},
    {h:'Margem',r:1,num:1,get:r=>pct(N(r['Margem liquida oficial'])),sort:r=>N(r['Margem liquida oficial'])??-1},
    {h:'Situação',get:r=>{const c=String(r.Classificacao||'');
      const cls=/NEGATIVO/.test(c)?'t-red':/ATENCAO/.test(c)?'t-amber':/POSITIVO/.test(c)?'t-green':'t-grey';
      return `<span class="tag ${cls}">${c.split(' - ')[0].toLowerCase()}</span>`},sort:r=>String(r.Classificacao)}

  <div class="sec">Black × White</div>
  <p class="sub" style="margin:-6px 0 12px">Taxa de saída antes e depois da virada de funil, pela data do pedido. Só produtos com data configurada.</p>
  ${table([
    {h:'Produto',get:r=>r.produto},
    {h:'Virada',get:r=>r['Data da virada']},
    {h:'Taxa Black',r:1,num:1,get:r=>pct(N(r['Taxa BLACK (mix 70/30)'])),sort:r=>N(r['Taxa BLACK (mix 70/30)'])??-1},
    {h:'Taxa White',r:1,num:1,get:r=>pct(N(r['Taxa WHITE'])),sort:r=>N(r['Taxa WHITE'])??-1},
    {h:'Delta',r:1,num:1,get:r=>{const v=N(r['Delta da taxa (WHITE - BLACK)']);
      return v==null?'—':`<b style="color:${v<0?'var(--green)':'var(--red)'}">${(v*100).toFixed(1).replace('.',',')} pp</b>`},
      sort:r=>N(r['Delta da taxa (WHITE - BLACK)'])??0},
    {h:'Dias de White',r:1,num:1,get:r=>N(r['Dias de White ate hoje'])??'—',sort:r=>N(r['Dias de White ate hoje'])||0},
    {h:'Veredito',get:r=>{const v=String(r.Veredito||'');const cls=/PIOROU/.test(v)?'t-red':/MELHOROU\?/.test(v)?'t-amber':/MELHOROU/.test(v)?'t-green':'t-grey';
      return `<span class="tag ${cls}">${/PIOROU/.test(v)?'piorou':/MELHOROU/.test(v)?'melhorou?':'—'}</span>`},sort:r=>String(r.Veredito)}
  ],D.bw)}
  <div class="note" style="margin-top:14px"><b>Não tire conclusão daqui ainda.</b> A janela White tem de 12 a 33 dias e a política de reembolso é de 60.
  A taxa White sai baixa por construção, não necessariamente por mérito. MaroBrain é a exceção que interessa: piorou mesmo com janela curta.</div>`;
};

const NAO_AFIL='Sem Afiliado / Pedido Direto';
V.afiliados=()=>{
  const direto=D.afiliados.find(r=>r.Afiliado===NAO_AFIL);
  const a=D.afiliados.filter(r=>(N(r['Gross total'])>0||r.aov_white)&&r.Afiliado!==NAO_AFIL);
  const st={}; a.forEach(r=>{const k=String(r.Status||'—').split(' (')[0];st[k]=(st[k]||0)+1});
  const crit=a.filter(r=>/CRITICO/.test(String(r['Alerta de qualidade']||'')));
  const cards=[
    {l:'Pararam',v:st['PAROU']||0,n:'mais de 30 dias sem vender',c:'is-red'},
    {l:'Esfriando',v:st['ESFRIANDO']||0,n:'de 7 a 30 dias parados',c:'is-amber'},
    {l:'Ativos',v:(st['CRESCENDO']||0)+(st['ESTAVEL']||0)+(st['CAINDO']||0),n:`${st['CRESCENDO']||0} crescendo · ${st['CAINDO']||0} caindo`,c:'is-green'},
    {l:'Saída ≥30%',v:crit.length,n:moneyK(crit.reduce((s,r)=>s+N(r['Gross total']),0))+' de gross',c:'is-red'}
  ].map(k=>`<div class="card kpi ${k.c}"><div class="lab">${k.l}</div>
    <div class="val">${k.v}</div><div class="note">${k.n}</div></div>`).join('');
  const meses=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];
  return `<div class="grid g4">${cards}</div>
  ${direto?`<div class="note" style="margin-top:14px"><b>Fora deste recorte:</b> venda sem afiliado (tráfego direto e recompra)
    somou ${moneyK(N(direto['Gross total']))} no ano com ${pct(N(direto['Taxa de saida']))} de saída.
    Não é afiliado e por isso não entra no ranking, mas continua nos totais da operação.</div>`:''}
  <div class="note" style="margin:10px 0 4px"><b>Contas internas</b> (HelpGrid, MaxWeb, Tiger Offers, gestores) ficam fora deste ranking, mas continuam dentro dos totais da operação.</div>
  <div class="sec">Progressão mês a mês</div>
  <div class="ctl"><input type="search" id="qaf" placeholder="Buscar afiliado…" oninput="filtAf(this.value)">
    <button class="btn" onclick="filtAf('',this)" aria-pressed="true">Todos</button>
    <button class="btn" onclick="filtAf('__crit',this)">Só críticos</button>
    <button class="btn" onclick="filtAf('__cresc',this)">Só crescendo</button></div>
  <div id="afWrap">${afTable(a.sort((x,y)=>N(y['Gross total'])-N(x['Gross total'])),meses)}</div>
  <p style="font-size:11.5px;color:var(--muted);margin-top:10px">Todos os afiliados. Use a busca para filtrar.</p>`;
};
function afTable(rows,meses){
  return table([
    {h:'Afiliado',get:r=>String(r.Afiliado).slice(0,30)},
    ...meses.map(m=>({h:mesLbl(m),r:1,num:1,get:r=>{const v=N(r[m]);
      return v?`<span style="color:${v>50000?'var(--navy)':'var(--ink-2)'}">${Math.round(v/1000)}k</span>`:'<span style="color:#CBD5E1">·</span>'},
      sort:r=>N(r[m])||0})),
    {h:'Gross ano',r:1,num:1,get:r=>money(N(r['Gross total'])),sort:r=>N(r['Gross total'])||0,bar:r=>N(r['Gross total'])/1e6},
    {h:'% saída',r:1,num:1,get:r=>{const v=N(r['Taxa de saida']);
      return v==null?'—':`<b style="color:${v>=.3?'var(--red)':v>=.2?'var(--amber)':'var(--ink)'}">${pct(v)}</b>`},sort:r=>N(r['Taxa de saida'])??-1},
    {h:'AOV Líq. White',r:1,num:1,get:r=>{
      const w=r.aov_white; const b=r.aov_black;
      if(!w) return '<span style="color:#CBD5E1">—</span>';
      const tip=b?`AOV Líq. Black (jun–jul): $${b.toFixed(2)}`:'sem dado Black';
      const delta=b?(w-b):null;
      const dspan=delta!=null?`<span style="font-size:10px;color:${delta>0?'var(--green)':'var(--red)'}"> ${delta>0?'▲':'▼'}$${Math.abs(delta).toFixed(0)}</span>`:'';
      return `<span class="pt" data-t="${tip}" style="cursor:default;font-family:var(--fm)">$${w.toFixed(0)}${dspan}</span>`;
    },sort:r=>r.aov_white??-1},
    {h:'Var. 3m',r:1,num:1,get:r=>{const v=N(r['Variacao 3m']);
      return v==null?'—':`<span style="color:${v>0?'var(--green)':'var(--red)'}">${v>0?'+':''}${(v*100).toFixed(0)}%</span>`},sort:r=>N(r['Variacao 3m'])??-99},
    {h:'Parado há',r:1,num:1,get:r=>N(r['Dias sem vender'])+'d',sort:r=>N(r['Dias sem vender'])||0},
    {h:'Status',get:r=>{const s=String(r.Status||'').split(' (')[0];
      const cls=s==='PAROU'?'t-red':s==='ESFRIANDO'?'t-amber':s==='CRESCENDO'?'t-green':s==='CAINDO'?'t-amber':'t-blue';
      return `<span class="tag ${cls}">${s.toLowerCase()}</span>`},sort:r=>String(r.Status)}
  ],rows);
}
function filtAf(q,btn){
  if(btn){$$('#main .ctl .btn').forEach(b=>b.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true')}
  const meses=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06','2026-07','2026-08'];
  let rows=D.afiliados.filter(r=>(N(r['Gross total'])>0||r.aov_white)&&r.Afiliado!==NAO_AFIL);
  if(q==='__crit')rows=rows.filter(r=>/CRITICO/.test(String(r['Alerta de qualidade']||'')));
  else if(q==='__cresc')rows=rows.filter(r=>/CRESCENDO/.test(String(r.Status||'')));
  else if(q)rows=rows.filter(r=>String(r.Afiliado).toLowerCase().includes(q.toLowerCase()));
  rows=rows.sort((x,y)=>N(y['Gross total'])-N(x['Gross total']));
  $('#afWrap').innerHTML=afTable(rows,meses);
}

V.dados=()=>{
  const rc=D.recon.filter(r=>N(r['Gross oficial'])>0);
  const so=rc.reduce((a,r)=>a+(N(r['Reembolso oficial'])||0),0), sc=rc.reduce((a,r)=>a+(N(r['Reembolso calculado'])||0),0);
  return `<div class="grid g4">
    <div class="card kpi is-green"><div class="lab">Gap no reembolso</div><div class="val">${pct(Math.abs(so-sc)/so,1)}</div>
      <div class="note">calculado vs Master Accounts oficial</div></div>
    <div class="card kpi is-green"><div class="lab">Casamento por Order ID</div><div class="val">88,2%</div>
      <div class="note">reembolsos ligados à base de pedidos</div></div>
    <div class="card kpi is-amber"><div class="lab">Duplicidade removida</div><div class="val">$26.375</div>
      <div class="note">82 chargebacks dentro do arquivo de reembolso</div></div>
    <div class="card kpi is-navy"><div class="lab">Contas conferidas</div><div class="val">${rc.length}</div>
      <div class="note">uma a uma contra o oficial</div></div>
  </div>
  <div class="sec">Reconciliação conta a conta</div>
  ${table([
    {h:'Conta',get:r=>r['Conta (oficial)']},
    {h:'Gross oficial',r:1,num:1,get:r=>money(N(r['Gross oficial'])),sort:r=>N(r['Gross oficial'])||0},
    {h:'Gross calculado',r:1,num:1,get:r=>money(N(r['Gross calculado'])),sort:r=>N(r['Gross calculado'])||0},
    {h:'Reembolso oficial',r:1,num:1,get:r=>money(N(r['Reembolso oficial'])),sort:r=>N(r['Reembolso oficial'])||0},
    {h:'Reembolso calculado',r:1,num:1,get:r=>money(N(r['Reembolso calculado'])),sort:r=>N(r['Reembolso calculado'])||0},
    {h:'Gap',r:1,num:1,get:r=>{const v=N(r['% do gap de reembolso']);
      return v==null?'—':`<span style="color:${Math.abs(v)>.1?'var(--amber)':'var(--green)'}">${(v*100).toFixed(1).replace('.',',')}%</span>`},
      sort:r=>Math.abs(N(r['% do gap de reembolso'])??0)}

function bindTips(){$$('.pt').forEach(p=>{
  if(p.dataset.b)return; p.dataset.b=1;
  p.addEventListener('mousemove',e=>tipOn(e,p.dataset.t));p.addEventListener('mouseleave',tipOff)})}
function go(v){
  $$('.nav').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));
  const [t,s]=META[v];
  $('#main').innerHTML=`<div class="head"><div><h1>${t}</h1><p class="sub">${s}</p></div>
    <div class="periodo">01 jan → 26 ago 2026 · 31 contas</div></div><div class="view on">${V[v]()}</div>`;
  if(v==='cohort'){setCoh($('#main .ctl .btn'),false);setCoh($('#main .cbp[aria-pressed="true"]')||$('#main .cbp'),true);}
  bindTips();
  window.scrollTo(0,0);
}
window.setBase=(btn,base)=>{
  $$('#main .ctl .btn').forEach(b=>b.setAttribute('aria-pressed','false'));btn.setAttribute('aria-pressed','true');
  const src=base==='caixa'?D.mensal:D.coorte;
  $('#evT').textContent=base==='caixa'?'Mensal · base caixa':'Mensal · base safra';
  $('#evC').textContent=base==='caixa'?'Taxa de reembolso sobre o gross do mês, pela data em que o dinheiro saiu.'
    :'Reembolso atribuído ao mês em que a venda foi feita. Junho em diante ainda não maturou.';
  $('#evChart').innerHTML=lineChart([{name:'% reembolso',values:src.map(r=>N(r['% Reembolso ($)'])*100),
    color:base==='caixa'?'var(--red)':'var(--blue)',area:1}],
    {labels:src.map(r=>mesLbl(r.mes)),min:0,max:32,fmtY:v=>v.toFixed(0)+'%',fmtT:v=>v.toFixed(1)+'%'});
  $$('#evChart .pt').forEach(p=>{p.addEventListener('mousemove',e=>tipOn(e,p.dataset.t));p.addEventListener('mouseleave',tipOff)});
};
$$('.nav').forEach(b=>b.onclick=()=>go(b.dataset.v));
go('geral');
</script>
