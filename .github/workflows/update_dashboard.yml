name: Atualizar Dashboard

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 BRT
  workflow_dispatch:
    inputs:
      debug_dom:
        description: 'Despejar HTML dos botões quando falhar (1 = sim)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar Playwright e Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # ── 1. baixar os xlsx dos últimos 60 dias ──────────────────────────────
      - name: Baixar exports da BuyGoods (últimos 60 dias)
        env:
          BG_EMAIL:    ${{ secrets.BG_EMAIL }}
          BG_PASSWORD: ${{ secrets.BG_PASSWORD }}
          BG_ACCOUNTS: ${{ secrets.BG_ACCOUNTS }}
          # ligue o diagnóstico rodando o workflow manualmente com DEBUG_DOM=1
          DEBUG_DOM:   ${{ github.event.inputs.debug_dom || '0' }}
        run: python scripts/baixar_exports.py

      # ── 2. processar os xlsx novos → salvar em data/new/ ──────────────────
      - name: Processar dados novos
        run: |
          mkdir -p data/new
          python scripts/analise_ano_tigeroffers.py \
            --entrada entrada/ \
            --saida   data/new/

      # ── 3. merge: acumular new/ com o histórico em data/ ──────────────────
      - name: Merge com histórico acumulado
        run: python scripts/merge_csvs.py

      # ── 4. gerar o dashboard com o histórico completo ─────────────────────
      - name: Gerar dashboard HTML
        run: python scripts/gerar_dashboard.py

      # ── 5. commit dos CSVs atualizados + dashboard ─────────────────────────
      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/pedidos data/reembolsos data/chargebacks
          git diff --staged --quiet || \
            git commit -m "Dashboard $(date -u '+%d/%m/%Y %H:%M') UTC" && \
            git push
