name: Atualizar Dashboard

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC = 06:00 BRT, todos os dias
  workflow_dispatch:        # botão "Run workflow" manual no GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # aborta se travar (31 contas × 3 tipos pode demorar)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Instalar dependências Python
        run: pip install -r requirements.txt

      - name: Instalar Playwright e Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Baixar exports da BuyGoods
        env:
          BG_EMAIL:    ${{ secrets.BG_EMAIL }}
          BG_PASSWORD: ${{ secrets.BG_PASSWORD }}
          BG_ACCOUNTS: ${{ secrets.BG_ACCOUNTS }}
        run: python scripts/baixar_exports.py

      - name: Processar dados (atualizar CSVs acumulados)
        run: |
          python scripts/analise_ano_tigeroffers.py \
            --entrada entrada/ \
            --saida   data/

      - name: Gerar dashboard HTML
        run: python scripts/gerar_dashboard.py

      - name: Commit e push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/index.html data/base_*.csv
          git diff --staged --quiet || \
            git commit -m "Dashboard $(date -u '+%d/%m/%Y %H:%M') UTC" && \
            git push
